<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Rutas de Hoteles</title>
  <link rel="stylesheet" href="styles.css">
  <script src="/_sdk/element_sdk.js"></script>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="https://cdn.tailwindcss.com" type="text/javascript"></script>
</head>

<body>
  <div class="container">
    <div class="header">
      <h1 id="app-title">Gestor de Rutas de Hoteles</h1>
      <p id="instruction-text">Selecciona los hoteles para calcular la ruta más eficiente</p>
    </div>
    <div class="main-content">
      <div class="hotels-section">
        <div class="section-header">
          <h2 class="section-title">📍 Hoteles Disponibles</h2>
          <span class="hotel-count" id="hotel-count">0 hoteles</span>
        </div>
        <div class="search-box">
          <input type="text" id="search-input" class="search-input"
            placeholder="🔍 Buscar hotel por nombre, ruta o dirección...">
        </div>
        <div class="hotels-list" id="hotels-list"></div>
      </div>
      <div class="sidebar">
        <div class="section-header">
          <h2 class="section-title">🗺️ Ruta Seleccionada</h2>
          <span class="hotel-count" id="selected-count">0 seleccionados</span>
        </div>
        <div class="selected-hotels" id="selected-hotels"></div>
        <div class="route-actions">
          <button class="btn btn-success" id="calculate-route-btn" disabled>
            <span>🧭 Calcular Ruta Óptima</span>
          </button>
          <button class="btn btn-primary" id="clear-selection-btn" disabled>
            <span>🔄 Limpiar Selección</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Plantillas que js/ui.js clona y rellena (los campos se marcan con data-field) -->
  <template id="hotel-card-template">
    <div class="hotel-card">
      <div class="hotel-header">
        <div class="hotel-info">
          <span class="hotel-route" data-field="route"></span>
          <h3 class="hotel-name" data-field="name"></h3>
          <p class="hotel-address">📍 <span data-field="address"></span></p>
          <p class="hotel-comment" data-field="comment"></p>
        </div>
        <div class="checkbox-container">
          <input type="checkbox" class="checkbox" aria-label="Seleccionar hotel">
        </div>
      </div>
    </div>
  </template>

  <template id="selected-item-template">
    <div class="selected-hotel-item">
      <div>
        <div class="selected-hotel-name" data-field="name"></div>
        <div class="selected-hotel-meta" data-field="meta"></div>
      </div>
      <span class="route-dot"></span>
    </div>
  </template>

  <template id="empty-state-template">
    <div class="empty-state">
      <div class="empty-icon" data-field="icon"></div>
      <p data-field="message"></p>
    </div>
  </template>

  <template id="toast-template">
    <div class="toast">
      <span data-field="icon"></span>
      <span data-field="message"></span>
    </div>
  </template>

  <script src="js/hotels.js"></script>
  <script src="js/route.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
